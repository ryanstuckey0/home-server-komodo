[[stack]]
name = "home-assistant"
description = "Home Assistant home automation platform"

[stack.config]
server = "rp5"
file_paths = ["stacks/rp5/apps/homeassistant/compose.yaml"]
repo = "ryanstuckey0/home-server-komodo"
branch = "main"

[[stack]]
name = "vaultwarden"
description = "Vaultwarden password manager"

[stack.config]
server = "rp5"
file_paths = ["stacks/rp5/apps/vaultwarden/compose.yaml"]
repo = "ryanstuckey0/home-server-komodo"
branch = "main"
environment = """
VAULTWARDEN_ADMIN_TOKEN = [[VAULTWARDEN_ADMIN_TOKEN]]
"""

[[stack]]
name = "homepage"
description = "Homepage dashboard with Glances system stats"

[stack.config]
server = "rp5"
file_paths = ["stacks/rp5/apps/homepage/compose.yaml"]
repo = "ryanstuckey0/home-server-komodo"
branch = "main"
environment = """
HOMEPAGE_VAR_ADGUARD_USERNAME = [[HOMEPAGE_VAR_ADGUARD_USERNAME]]
HOMEPAGE_VAR_ADGUARD_PASSWORD = [[HOMEPAGE_VAR_ADGUARD_PASSWORD]]
HOMEPAGE_VAR_HA_TOKEN = [[HOMEPAGE_VAR_HA_TOKEN]]
HOMEPAGE_VAR_TRUENAS_API_KEY = [[HOMEPAGE_VAR_TRUENAS_API_KEY]]
HOMEPAGE_VAR_JELLYFIN_API_KEY = [[HOMEPAGE_VAR_JELLYFIN_API_KEY]]
HOMEPAGE_VAR_KM_KEY = [[HOMEPAGE_VAR_KM_KEY]]
HOMEPAGE_VAR_KM_SECRET = [[HOMEPAGE_VAR_KM_SECRET]]
HOMEPAGE_VAR_UNIFI_USERNAME = [[HOMEPAGE_VAR_UNIFI_USERNAME]]
HOMEPAGE_VAR_UNIFI_PASSWORD = [[HOMEPAGE_VAR_UNIFI_PASSWORD]]
"""

[[stack]]
name = "syncthing"
description = "Syncthing file sync (always-on hub node for Satisfactory blueprints)"

[stack.config]
server = "rp5"
file_paths = ["stacks/rp5/apps/syncthing/compose.yaml"]
repo = "ryanstuckey0/home-server-komodo"
branch = "main"

[[stack]]
name = "glances-rp5"
description = "Glances system stats for RP5"

[stack.config]
server = "rp5"
file_paths = ["stacks/rp5/apps/glances/compose.yaml"]
repo = "ryanstuckey0/home-server-komodo"
branch = "main"

[[stack]]
name = "cup"
description = "Docker container update status"

[stack.config]
server = "rp5"
file_paths = ["stacks/rp5/apps/cup/compose.yaml"]
repo = "ryanstuckey0/home-server-komodo"
branch = "main"