services:
  caddy:
    build: .
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - /mnt/pool02/apps/appdata/caddy:/data   # pool02 NVMe, backed up (recordsize=128K, compression=lz4, sync=standard)
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: caddy_default
