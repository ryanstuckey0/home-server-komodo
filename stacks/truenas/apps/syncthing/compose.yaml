services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    hostname: syncthing-nas   # shown to other Syncthing devices
    environment:
      - PUID=568   # TrueNAS 'apps' user; granted access to the blueprint folder via NFSv4 ACL (no ownership change to the docs dataset)
      - PGID=568
      - STGUIADDRESS=0.0.0.0:8384   # expose GUI to the Caddy container
    volumes:
      - /mnt/pool01/appdata/syncthing:/var/syncthing/config
      # Mount the whole satisfactory/ dir so blueprints + saves + future
      # subfolders share one mount; set each Syncthing folder path to
      # /data/satisfactory/<name> (matches the RP5 node's paths).
      # The NFSv4 ACL granting apps(568) must cover each synced subfolder
      # (currently blueprints); grant it on .../satisfactory to cover all.
      - /mnt/pool01/docs/games/satisfactory:/data/satisfactory
    ports:
      - "22000:22000/tcp"   # sync protocol
      - "22000:22000/udp"   # sync protocol (QUIC)
      - "21027:21027/udp"   # LAN discovery broadcasts
    networks:
      - caddy_default

networks:
  caddy_default:
    external: true
