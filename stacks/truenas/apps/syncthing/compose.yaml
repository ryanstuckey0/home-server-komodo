services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    hostname: syncthing-nas   # shown to other Syncthing devices
    environment:
      - PUID=3003   # dedicated 'syncthing' service user
      - PGID=3003
      - STGUIADDRESS=0.0.0.0:8384   # expose GUI to the Caddy container
    volumes:
      - /mnt/pool02/apps/appdata/syncthing:/var/syncthing/config   # pool02 NVMe, backed up (recordsize=128K, compression=lz4, sync=standard)
      - /mnt/pool01/users/ryanstuckey/games/saves/satisfactory:/data/satisfactory   # pool01 HDD (synced user data)
    ports:
      - "22000:22000/tcp"   # sync protocol
      - "22000:22000/udp"   # sync protocol (QUIC)
      - "21027:21027/udp"   # LAN discovery broadcasts
    networks:
      - caddy_default

networks:
  caddy_default:
    external: true
