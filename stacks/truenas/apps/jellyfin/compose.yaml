services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "7359:7359/udp"
    volumes:
      - /mnt/pool02/apps/appdata/jellyfin/config:/config          # pool02 NVMe, backed up (recordsize=16K, compression=lz4, sync=standard)
      - /mnt/pool02/apps/temp/jellyfin/cache:/cache               # pool02 NVMe, scratch (recordsize=128K, compression=lz4, sync=standard)
      - /mnt/pool02/apps/temp/jellyfin/transcodes:/cache/transcodes # pool02 NVMe, scratch (recordsize=1M, compression=off, sync=disabled)
      - /mnt/pool01/media:/media:ro                               # pool01 HDD (media library)
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "107"  # render GID on TrueNAS host (/dev/dri/renderD128)
      - "video"
    networks:
      - caddy_default

networks:
  caddy_default:
    external: true
