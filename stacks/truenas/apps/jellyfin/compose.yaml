services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.8
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "7359:7359/udp"
    volumes:
      - /mnt/pool01/appdata/jellyfin/config:/config      # pool01 HDD, replicated (recordsize=8K, compression=lz4)
      - /mnt/pool02/jellyfin/cache:/cache                # pool02 NVMe (compression=lz4)
      - /mnt/pool02/jellyfin/transcode:/cache/transcodes # pool02 NVMe (recordsize=1M, sync=disabled)
      - /mnt/pool01/media:/media:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "107"  # render GID on TrueNAS host (/dev/dri/renderD128)
      - "video"
    networks:
      - caddy_default

networks:
  caddy_default:
    external: true
