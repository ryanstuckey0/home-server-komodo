services:
  syncthing:
    image: syncthing/syncthing:2.1.3
    container_name: syncthing
    restart: unless-stopped
    hostname: syncthing-rp5   # shown to other Syncthing devices
    environment:
      - PUID=1000   # adjust to the host user that should own synced files
      - PGID=1000
      - STGUIADDRESS=0.0.0.0:8384   # expose GUI to the Caddy container
    volumes:
      - /opt/appdata/syncthing/config:/var/syncthing/config
      - /opt/appdata/syncthing/data:/data
    ports:
      - "22000:22000/tcp"   # sync protocol (forward on the router for direct connections)
      - "22000:22000/udp"   # sync protocol (QUIC)
      - "21027:21027/udp"   # LAN discovery broadcasts
    networks:
      - caddy_default

networks:
  caddy_default:
    external: true
