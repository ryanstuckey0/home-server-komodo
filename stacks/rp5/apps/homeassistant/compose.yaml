services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - /opt/appdata/homeassistant:/config
      # Version-controlled declarative config, deployed from git by Komodo.
      # Overlaid read-only on top of the writable /config state volume above.
      - ./config/packages:/config/packages:ro
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    environment:
      TZ: America/New_York

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/appdata/matter-server:/data
      - /run/dbus:/run/dbus:ro
