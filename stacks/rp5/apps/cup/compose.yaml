services:
  cup:
    image: ghcr.io/sergi0g/cup:v3.5.1
    container_name: cup-rp5
    restart: unless-stopped
    command: -c /config/cup.json serve
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./cup.json:/config/cup.json
    dns:
      - 192.168.1.2
    networks:
      - caddy_default

networks:
  caddy_default:
    external: true