services:
  unbound-lan:
    image: mvance/unbound-rpi:1.22.0
    container_name: unbound-lan
    restart: unless-stopped
    volumes:
      - ./unbound-lan.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    networks:
      caddy_default:
      dns_internal:
        ipv4_address: 10.10.10.3
    healthcheck:
      test: ["CMD-SHELL", "drill @127.0.0.1 km.beansrn.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  unbound-ts:
    image: mvance/unbound-rpi:1.22.0
    container_name: unbound-ts
    restart: unless-stopped
    volumes:
      - ./unbound-ts.conf:/opt/unbound/etc/unbound/unbound.conf:ro
    networks:
      caddy_default:
      dns_internal:
        ipv4_address: 10.10.10.4
    healthcheck:
      test: ["CMD-SHELL", "drill @127.0.0.1 km.beansrn.com || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  adguard-home:
    image: adguard/adguardhome:v0.107.79
    container_name: adguard-home
    restart: unless-stopped
    network_mode: host
    depends_on:
      - unbound-lan
      - unbound-ts
    volumes:
      - /opt/appdata/adguard/work:/opt/adguardhome/work
      - /opt/appdata/adguard/conf:/opt/adguardhome/conf

networks:
  caddy_default:
    external: true
  dns_internal:
    internal: true
    ipam:
      config:
        - subnet: 10.10.10.0/24
